# nginx is the public face on :80. It serves the built React SPA and reverse-proxies the API
# (and health endpoints) to the co-located .NET app on 127.0.0.1:8080.

# The access log shares the container's output with the API's, and is written to match its lines:
# short, aligned and coloured (`docker logs` and Unraid's log view both show ANSI colour). The API
# logs every request it answers, so nginx logs only what never reached it: something nginx answered
# itself with an error (a missing asset, a body over the limit) or the API not answering at all.
# A file served, or a request handed to the API, writes nothing here.
#
# Only the path is logged, never the query string or the referer: a password-reset link is
# /reset-password?email=…&token=…, and a log holding it hands the account to whoever reads it.
#
# The formats hold the escape character (0x1B) literally, before each "[" of a colour code; most
# editors don't show it. Variables are still escaped, as nginx always does: a path can't add
# escapes of its own to a line.
map $time_iso8601 $log_time {
    "~T(?<log_hms>[0-9:]{8})"  $log_hms;
    default                    $time_iso8601;
}

# Something nginx answered itself with a 4xx (no upstream status). 499, a client that hung up, isn't
# news.
map "$upstream_status:$status" $log_client_error {
    ":499"   0;
    "~^:4"   1;
    default  0;
}

# A 5xx nginx answered itself, or the API not answering (502: not reachable, 504: timed out). A 5xx
# the API sent, it has logged.
map "$upstream_status:$status" $log_server_error {
    "~^:5"              1;
    "~^50[24]:50[24]$"  1;
    default             0;
}

# ASCII only, here and in the method column: nginx escapes every other byte of a variable.
map $status $log_hint {
    502      ": CalendarIT's app is not reachable";
    504      ": CalendarIT's app did not answer in time";
    default  "";
}

# Every GUID in the path cut to its first 8 characters, as the API's lines show them — dashed, or
# the 32 bare hex digits of a CalDAV href. A map can rewrite one match, so two chained maps cover
# the most any route has (a calendar and an event in it).
map $uri $log_uri_one {
    "~^(?<log_a1>.*?(?<![0-9a-fA-F])[0-9a-fA-F]{8})(?:-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-|[0-9a-fA-F]{12})[0-9a-fA-F]{12}(?![0-9a-fA-F])(?<log_a2>.*)$"  "${log_a1}${log_a2}";
    default  $uri;
}

map $log_uri_one $log_uri {
    "~^(?<log_b1>.*?(?<![0-9a-fA-F])[0-9a-fA-F]{8})(?:-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-|[0-9a-fA-F]{12})[0-9a-fA-F]{12}(?![0-9a-fA-F])(?<log_b2>.*)$"  "${log_b1}${log_b2}";
    default  $log_uri_one;
}

# The method padded to the API's column, so the paths line up.
map $request_method $log_method {
    GET      "GET   ";
    HEAD     "HEAD  ";
    POST     "POST  ";
    PUT      "PUT   ";
    PATCH    "PATCH ";
    DELETE   "DELETE";
    default  $request_method;
}

log_format client_error '[38;5;244m$log_time[0m [38;5;42mINF[0m  [38;5;250m$log_method[0m [38;5;253m$log_uri[0m '
                        '[38;5;220m$status[0m  [38;5;244mnginx[0m';
log_format server_error '[38;5;244m$log_time[0m [1;38;5;231;48;5;160mERR[0m  [38;5;250m$log_method[0m [38;5;253m$log_uri[0m '
                        '[1;38;5;196m$status[0m  [38;5;244mnginx$log_hint[0m';

# The same lines without colour, for NO_COLOR (https://no-color.org); the entrypoint picks a pair.
log_format client_error_plain '$log_time INF  $log_method $log_uri '
                              '$status  nginx';
log_format server_error_plain '$log_time ERR  $log_method $log_uri '
                              '$status  nginx$log_hint';

server {
    listen 80 default_server;
    server_name _;

    # Uploads: avatars are capped at 3 MB by the API; allow headroom for .ics imports too.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # To the container's output, where `docker logs` and Unraid show it and Docker's log rotation can
    # cap it. Only what the API never saw; see the formats above. (Debian's default wrote every
    # request, query string and referer included, to a file inside the container nothing rotated.)
    # Which pair of formats (coloured, or plain for NO_COLOR) is the entrypoint's choice, written
    # to this file at every start.
    include /etc/nginx/calendarit-access-log.conf;

    # Baseline hardening. `always` so they're sent on error responses too.
    #   - nosniff: avatars are stored with a client-supplied content type and echoed back as
    #     data: URLs, so browsers must not be free to re-interpret any of it.
    #   - frame-ancestors/DENY: nothing here should ever be framed — a calendar in an iframe is
    #     someone else's clickjacking UI.
    #   - style-src allows inline: FullCalendar positions events with style attributes. Scripts
    #     are bundled files only, so script-src stays strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The API sets the same headers itself (so they hold when it serves the SPA without nginx).
    # Drop its copies on proxied responses so none goes out twice.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;

    # --- API + health/readiness -> the .NET app ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CalDAV (DAVx5 and friends) -> the .NET app ---
    location /dav {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 6764: CalDAV clients probe the domain root for this path.
    location = /.well-known/caldav {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # --- SPA: hashed assets get long cache; everything else falls back to the app shell ---
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        # An add_header here replaces the server-level set rather than adding to it, so the
        # headers that matter for a script/style file are repeated instead of silently lost.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
