[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.11.01"
activity = "1.13.0"
lifecycle = "2.11.1"
core-ktx = "1.19.1"
splashscreen = "1.2.0"
room = "2.8.5"
work = "2.12.0"
datastore = "1.3.0"
coroutines = "1.11.0"
serialization = "1.13.0"
okhttp = "5.5.1"
junit = "4.13.2"
robolectric = "4.18.1"
ical4j = "4.4.0"
glance = "1.2.0"
unifiedpush = "3.3.6"
kizitonwose-calendar = "2.10.1"
