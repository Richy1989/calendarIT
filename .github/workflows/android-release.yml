name: Android release

# A git tag `24seven-vX.Y.Z` releases the Android app (24seven): the whole test suite runs first
# (test.yml), then the signed release builds are made and a GitHub Release is published with the
# APK. The app has its own version line, independent of the server's `vX.Y.Z` tags (release.yml
# does not react to these tags, nor this workflow to the server's).
#
# The tag must match versionName in android/app/build.gradle.kts — the build file stays the one
# place that says what the version (and versionCode) is, so local and CI builds never disagree.
# Pre-release tags (`24seven-v0.4.0-rc1`) are allowed only with the same suffix in versionName and
# are marked as pre-releases.
#
# Signing secrets (repository → Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64    the keystore file, base64 (`base64 -w0 secrets/24seven-release.p12`)
#   RELEASE_KEYSTORE_PASSWORD  its password
#   RELEASE_KEY_ALIAS          the key's alias (24seven)
#   RELEASE_KEY_PASSWORD       the key's password
# Without them the job stops: an unsigned or differently signed APK is never published.
#
# Actions are pinned to a release's commit, as in test.yml.
on:
  push:
    tags:
      - '24seven-v*'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  release:
    name: Build, sign and publish
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the tag against the app's version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#24seven-v}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a 24seven-vMAJOR.MINOR.PATCH[-suffix] tag." >&2
            exit 1
          fi
          DECLARED=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$DECLARED" != "$VERSION_NAME" ]; then
            echo "::error::Tag says $VERSION_NAME but app/build.gradle.kts has versionName \"$DECLARED\". Bump it (and versionCode) first." >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "$VERSION_NAME" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi

      # The keystore lives only in the runner's temp dir for this job; build.gradle.kts reads the
      # RELEASE_* variables before secrets/keystore.properties.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret RELEASE_$v is not set — see the header of this workflow." >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build (foss APK, play APK + bundle)
        run: ./gradlew --no-daemon assembleFossRelease assemblePlayRelease bundlePlayRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # Every APK must be signed, with the version the tag names; otherwise nothing is published.
      - name: Verify signatures and versions
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p ../dist
          for flavor in foss play; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$tools/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256'
            badging=$("$tools/aapt2" dump badging "$apk" | head -1)
            echo "$badging"
            grep -q "versionName='$VERSION_NAME'" <<< "$badging" || { echo "::error::$apk is not version $VERSION_NAME" >&2; exit 1; }
          done
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "../dist/24seven-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../dist/24seven-$VERSION_NAME-play.aab"
          cd ../dist && sha256sum "24seven-$VERSION_NAME.apk" > "24seven-$VERSION_NAME.apk.sha256" && cat ./*.sha256

      # The Play bundle stays a workflow artifact (uploaded to the Play Console by hand); only the
      # APK goes on the release page.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 24seven-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error

      # docs/releases/24seven-vX.Y.Z.md when there is one (committed before tagging), then how to
      # install. No generated notes: GitHub would list every commit since the last tag of any kind,
      # server changes included.
      - name: Release notes
        working-directory: .
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$notes" ]; then
              cat "$notes"
              echo
            else
              echo "::warning::No $notes — the release gets only a title and the install line." >&2
              echo "# 24seven ${VERSION_NAME}"
              echo
            fi
            echo "**Install:** download \`24seven-${VERSION_NAME}.apk\` on your phone (Android 14 or newer) and open it."
            echo "Updates install over an earlier 24seven APK from this page; the checksum is in \`24seven-${VERSION_NAME}.apk.sha256\`."
          } > release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: 24seven ${{ env.VERSION_NAME }}
          generate_release_notes: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          # The server's release stays the repository's "latest".
          make_latest: false
          body_path: release-notes.md
          files: |
            dist/24seven-${{ env.VERSION_NAME }}.apk
            dist/24seven-${{ env.VERSION_NAME }}.apk.sha256
