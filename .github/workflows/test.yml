name: Tests

# Every push to main and every pull request runs the whole test suite, and a release runs it
# again (release.yml calls this workflow) before any image is built: a version is published only
# when its tag passes.
#
# Actions are pinned to the commit of a release (the comment names it), not to a tag a
# maintainer, or someone who took over their account, could move. Dependabot keeps them current
# (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build + xUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/calendarITCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build

  web:
    name: Web app (lint + type check + build + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No dependency needs an install script to build or test, so none gets to run one here.
      # (legacy-peer-deps comes from web/.npmrc.)
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check + production build
        run: npm run build
      - name: Unit tests
        run: npm test

  android:
    name: Android app (lint + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Checks the wrapper jar against Gradle's published checksums before anything runs it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The runner's SDK doesn't carry every platform: AGP downloads what compileSdk names.
      - name: Lint
        run: ./gradlew --no-daemon lintFossDebug
      - name: Unit tests
        run: ./gradlew --no-daemon testFossDebugUnitTest testPlayDebugUnitTest
      - name: Build (foss + play, debug + release)
        run: ./gradlew --no-daemon assembleFossDebug assemblePlayDebug assembleFossRelease
