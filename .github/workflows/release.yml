name: Release

# A git tag `vX.Y.Z` is a release: build & push the Docker image (linux/amd64, same as
# deploy/build-and-push.ps1) and publish a GitHub Release. Pre-release tags like
# `v0.2.0-rc1` are allowed — they push the versioned image but do NOT move `:latest`,
# and the GitHub Release is marked as a pre-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Derive the version from the tag: vX.Y.Z[-suffix] -> VERSION_NAME=X.Y.Z[-suffix].
      # Same acceptance rule as deploy/build-and-push.ps1 — anything else would be stamped
      # into MSBuild's $(Version) and break the publish.
      - name: Compute version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a vMAJOR.MINOR.PATCH[-suffix] version tag." >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "$VERSION_NAME" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # ---- Docker image (SPA + API + nginx) to Docker Hub ----
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # flavor latest=auto: `:latest` moves only for clean semver tags, never for pre-releases —
      # mirrors the ":latest only moves on a release" policy in deploy/build-and-push.ps1.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: richy1989/calendarit
          tags: |
            type=semver,pattern={{version}}
      # Build the image once into the runner's Docker and check it before anything is pushed; the
      # push below reuses this build from the cache.
      - name: Build the image for checking
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: bundle
          platforms: linux/amd64
          load: true
          tags: calendarit:ci
          build-args: |
            VERSION=${{ env.VERSION_NAME }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it
        run: |
          docker run -d --name calendarit -p 8080:80 calendarit:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health >/dev/null && exit 0; sleep 1; done
          echo "the container never became healthy"; exit 1
      - name: The container log holds no token from a URL, and no escape a request sent
        # A password-reset link carries its token in the page URL, and any query string could carry
        # a secret. The API logs a request's path only, and nginx logs only what never reached the
        # API, by path (deploy/nginx.conf), so no query string may appear. A path can also carry
        # escape sequences, which a terminal showing the log would obey (Unraid's log view is one):
        # both logs must show them escaped.
        run: |
          curl -s -o /dev/null "http://localhost:8080/reset-password?email=ci%40example.com&token=ci-reset-secret"
          curl -s -o /dev/null "http://localhost:8080/api/events/export.ics?token=ci-api-secret"
          curl -s -o /dev/null "http://localhost:8080/assets/ci-missing.js?token=ci-asset-secret"
          curl -s -o /dev/null "http://localhost:8080/api/ci%1b%5b31minject"
          curl -s -o /dev/null "http://localhost:8080/assets/ci%1b%5b31minject.js"
          sleep 1
          docker logs calendarit > container.log 2>&1
          grep -q 'CalendarIT .* starting' container.log || { echo "the start-up line is missing"; exit 1; }
          grep -q '/api/events/export.ics' container.log || { echo "the API did not log the export request"; exit 1; }
          grep -q '/assets/ci-missing.js' container.log || { echo "nginx did not log the missing asset"; exit 1; }
          if grep -E 'ci-(reset|api|asset)-secret' container.log; then
            echo "a token from a URL reached the log"; exit 1
          fi
          [ "$(grep -ci 'x1b\[31minject' container.log)" -ge 2 ] \
            || { echo "the API and nginx did not both log the escape in the path, escaped"; exit 1; }
          if grep -q $'\e\[31minject' container.log; then
            echo "an escape sequence from a request reached the log raw"; exit 1
          fi
      - name: Container log
        if: failure()
        run: docker logs calendarit

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: bundle
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the API's assembly version (Dockerfile ARGs).
          build-args: |
            VERSION=${{ env.VERSION_NAME }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- GitHub Release ----
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body: |
            **Docker:** `docker pull richy1989/calendarit:${{ env.VERSION_NAME }}`

            Single-container image (SPA + API + nginx on :80). Mount `/data` to persist the
            SQLite db and uploads — see `deploy/calendarit.unraid.xml` for an Unraid template.
