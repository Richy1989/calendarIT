# CalendarIT — reference compose stack.
#
# Runs the app (API + bundled SPA) against PostgreSQL. The app serves plain HTTP on
# port 8080; put your own reverse proxy (Caddy / Traefik / nginx / ...) in front of it
# to terminate TLS. Copy .env.example to .env and set at least JWT_SIGNING_KEY.
#
# Nothing is published to the host. The app's port is plain HTTP — publishing it would put
# an unencrypted copy of the site on your server's public IP, next to the HTTPS one your
# proxy serves, and passwords and CalDAV credentials would cross the wire in the clear for
# anyone who reached it. Your proxy talks to the app over the `calendarit-edge` network
# instead; see the note at the bottom of this file.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendarit}
      POSTGRES_USER: ${POSTGRES_USER:-calendarit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendarit} -d ${POSTGRES_DB:-calendarit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_PROVIDER: Postgres
      POSTGRES_CONNECTION: "Host=db;Port=5432;Database=${POSTGRES_DB:-calendarit};Username=${POSTGRES_USER:-calendarit};Password=${POSTGRES_PASSWORD:-changeme}"
      APPDATA_PATH: /appdata
      APPLY_MIGRATIONS: "true"
      # Log level (Serilog reads config; override per-namespace with
      # Serilog__MinimumLevel__Override__<Namespace>). Console-only, to stdout.
      Serilog__MinimumLevel__Default: Information
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-calendarit}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-calendarit}
      # Your reverse proxy talks to this container directly, so one hop is trusted when
      # resolving the client IP the auth rate limit keys on.
      FORWARDED_PROXY_HOPS: ${FORWARDED_PROXY_HOPS:-1}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      # The address reset links point at. Never derived from the request (Host is a header
      # anyone can set), so without this, reset emails aren't sent at all.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # No SMTP settings: email (invitations + reminders) is sent through each user's own
      # mail account, connected in-app under Settings → Email.
    networks:
      # backend: reach Postgres. edge: where your reverse proxy finds us.
      - backend
      - edge
    volumes:
      - appdata:/appdata
    # No `ports:` on purpose — see the header. If your proxy runs on the host itself rather
    # than in a container, publish to loopback only, never 0.0.0.0:
    #   ports:
    #     - "127.0.0.1:8080:8080"

# Point your reverse proxy at http://app:8080 and attach it to `calendarit-edge`. From its own
# compose file that is:
#
#   services:
#     caddy:
#       networks: [calendarit-edge, default]
#   networks:
#     calendarit-edge:
#       external: true
#
# Postgres stays on `backend`, which the proxy never joins, so it isn't reachable from there.
networks:
  backend:
    name: calendarit-backend
  edge:
    name: calendarit-edge

volumes:
  pgdata:
  appdata:
